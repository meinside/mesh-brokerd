version: "2"

run:
  timeout: 5m
  # Tests behind these tags need a real network round trip (tls_e2e) or a
  # live brokerd database (diag), so they are excluded from `make check`.
  # Linting them anyway keeps them from rotting silently.
  build-tags:
    - tls_e2e
    - diag

linters:
  default: standard
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign

formatters:
  enable:
    - gofmt
